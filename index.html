<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Udara · Johor air quality</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <span class="brand">Udara<span class="dot">.</span></span>
    <button id="refresh" class="ghost" type="button">Refresh</button>
  </header>
  <main>
    <h1>Johor air quality</h1>
    <p class="sub">Live readings from <span class="src">DOE APIMS</span> · updated <span id="ago">…</span></p>
    <ul class="band-legend" id="legend"></ul>
    <section id="detail" class="detail" hidden>
      <div class="detail-head">
        <span class="name" id="dname"></span>
        <span class="val" id="dval"></span>
        <button id="dclose" class="ghost" type="button" aria-label="Close trend">×</button>
      </div>
      <svg id="chart" class="chart" role="img" aria-label="24-hour AQI trend"></svg>
      <p class="meta" id="dmeta"></p>
    </section>
    <ul id="stations" class="stations"><li class="muted">Loading…</li></ul>
    <p class="health" id="worst"></p>
  </main>
  <script type="module" src="/main.js"></script>
</body>
</html>
