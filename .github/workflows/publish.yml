name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom needs Node >=20.19 (undici CacheStorage); 20.x resolved older
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - run: npm run build

      # The deploy is skipped (not failed) until the Cloudflare secrets exist, so a
      # green run still means "tests and build are good" instead of training us to
      # ignore a permanently red main.
      - name: Check Cloudflare credentials
        id: cf
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=alam-dashboard --branch=main

      - name: Deploy skipped
        if: steps.cf.outputs.ready != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set - skipping deploy (build and tests passed)."
